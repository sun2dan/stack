    function generatePatternPins(limit = 500) {
  const result = new Set();

  // =====================
  // 工具函数
  // =====================

  function add(pin) {
    if (/^\d{4}$/.test(pin)) {
      result.add(pin);
    }
  }

  // =====================
  // 第一优先级
  // ABAB
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      add(`${a}${b}${a}${b}`);
    }
  }

  // =====================
  // AABB
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      add(`${a}${a}${b}${b}`);
    }
  }

  // =====================
  // AAAB
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      add(`${a}${a}${a}${b}`);
    }
  }

  // =====================
  // ABBB
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      add(`${a}${b}${b}${b}`);
    }
  }

  // =====================
  // ABAA
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      add(`${a}${b}${a}${a}`);
    }
  }

  // =====================
  // AABC
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      for (let c = 0; c <= 9; c++) {
        add(`${a}${a}${b}${c}`);
      }
    }
  }

  // =====================
  // BAAC
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      for (let c = 0; c <= 9; c++) {
        add(`${b}${a}${a}${c}`);
      }
    }
  }

  // =====================
  // ABCA
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      for (let c = 0; c <= 9; c++) {
        add(`${a}${b}${c}${a}`);
      }
    }
  }

  // =====================
  // ABCC
  // =====================

  for (let a = 0; a <= 9; a++) {
    for (let b = 0; b <= 9; b++) {
      for (let c = 0; c <= 9; c++) {
        add(`${a}${b}${c}${c}`);
      }
    }
  }

  // =====================
  // 不够5000则补随机双重复结构
  // =====================

  while (result.size < limit) {
    const nums = [];

    for (let i = 0; i < 4; i++) {
      nums.push(Math.floor(Math.random() * 10));
    }

    // 至少两个数字相同
    const count = {};

    nums.forEach((v) => {
      count[v] = (count[v] || 0) + 1;
    });

    const hasRepeat = Object.values(count).some((v) => v >= 2);

    if (hasRepeat) {
      add(nums.join(''));
    }
  }

  return [...result].slice(0, limit);
}

// 使用
// const patternPins = generatePatternPins(500);
// console.log(patternPins);

const highProbabilityPins = generatePatternPins1();

// 去重
const uniqueHighProbabilityPins = [...new Set(highProbabilityPins)];

/**
 * 已经尝试过的密码：
 * 1.日期 0101到1231
 * 2. 1900到2056
 * 3. 9800～9899，9900～9999
 *
 *
 *
 */
const GENERATED_KEY = 'generatedPins';
const IMPORTED_KEY = 'importedPins';

let generatedPins = JSON.parse(localStorage.getItem(GENERATED_KEY) || '[]');

let importedPins = new Set(
  JSON.parse(localStorage.getItem(IMPORTED_KEY) || '[]'),
);

let currentIndex = generatedPins.length - 1;

const pinEl = document.getElementById('pin');
const countEl = document.getElementById('count');
const historyEl = document.getElementById('history');
const batchInput = document.getElementById('batchInput');

function save() {
  localStorage.setItem(GENERATED_KEY, JSON.stringify(generatedPins));

  localStorage.setItem(IMPORTED_KEY, JSON.stringify([...importedPins]));
}

function getAllTestedSet() {
  return new Set([...generatedPins, ...importedPins]);
}

function updateCount() {
  const total = getAllTestedSet().size;

  countEl.innerText = `总已尝试: ${total} / 10000
随机生成: ${generatedPins.length}
手动导入: ${importedPins.size}`;
}

function updateHistory() {
  historyEl.innerHTML = generatedPins
    .slice()
    .reverse()
    .map((v, i) => {
      const realIndex = generatedPins.length - 1 - i;

      const mark = realIndex === currentIndex ? '👉 ' : '';

      return `<div>${mark}${v}</div>`;
    })
    .join('');
}

function showCurrent() {
  if (currentIndex >= 0 && currentIndex < generatedPins.length) {
    pinEl.innerText = generatedPins[currentIndex];
  }

  updateHistory();
  updateCount();
}

function generateNextPin() {
  const tested = getAllTestedSet();

  // 1. 优先从高概率 PIN 中找

  const remainHighPins = uniqueHighProbabilityPins.filter(
    (pin) => !tested.has(pin),
  );

  // 如果还有高概率 PIN
  if (remainHighPins.length > 0) {
    const pin = remainHighPins[0];

    generatedPins.push(pin);

    currentIndex = generatedPins.length - 1;

    save();

    showCurrent();

    return;
  }

  // 2. 高概率 PIN 全部试完
  // 再随机生成

  if (tested.size >= 10000) {
    pinEl.innerText = 'DONE';

    return;
  }

  let pin;

  do {
    pin = Math.floor(Math.random() * 10000)
      .toString()
      .padStart(4, '0');
  } while (tested.has(pin));

  generatedPins.push(pin);

  currentIndex = generatedPins.length - 1;

  save();

  showCurrent();
}

function generateNextPin1() {
  const tested = getAllTestedSet();

  if (tested.size >= 10000) {
    pinEl.innerText = 'DONE';
    return;
  }

  let pin;

  do {
    pin = Math.floor(Math.random() * 10000)
      .toString()
      .padStart(4, '0');
  } while (tested.has(pin));

  generatedPins.push(pin);

  currentIndex = generatedPins.length - 1;

  save();

  showCurrent();
}

function prevPin() {
  if (currentIndex > 0) {
    currentIndex--;
    showCurrent();
  }
}

function nextPin() {
  if (currentIndex < generatedPins.length - 1) {
    currentIndex++;
    showCurrent();
  } else {
    generateNextPin();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    nextPin();
  }
});

document.getElementById('prevBtn').addEventListener('click', prevPin);

document.getElementById('nextBtn').addEventListener('click', nextPin);

document.getElementById('importBtn').addEventListener('click', () => {
  const lines = batchInput.value
    .split('\n')
    .map((v) => v.trim())
    .filter((v) => /^\d{4}$/.test(v));

  let added = 0;

  lines.forEach((v) => {
    if (!importedPins.has(v) && !generatedPins.includes(v)) {
      importedPins.add(v);
      added++;
    }
  });

  save();

  updateCount();

  alert(`导入成功: ${added} 个`);

  batchInput.value = '';
});

if (generatedPins.length === 0) {
  generateNextPin();
} else {
  showCurrent();
}
